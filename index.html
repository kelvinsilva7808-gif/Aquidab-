<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Estética Aquidabã</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#0b0b0d;--card:#141518;--line:#2c2a25;--gold:#d4af6a;--gold2:#a07c3a;--tx:#f3eee3;--mut:#9d9788;--gr:#009246;--rd:#ce2b37;--ok:#6fcf97;--bad:#ef7b84;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:radial-gradient(900px 500px at 85% -5%,#2b2112 0,transparent 60%),radial-gradient(700px 400px at -10% 100%,#161d18 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:700;letter-spacing:.06em;line-height:1;background:linear-gradient(180deg,#f0d9a0,#b8924a);-webkit-background-clip:text;background-clip:text;color:transparent}
.flag{display:flex;height:3px;margin-top:7px;width:100%;border-radius:2px;overflow:hidden}.flag i{flex:1}.flag i:nth-child(1){background:var(--gr)}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:var(--rd)}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#08080a ee;background:rgba(8,8,10,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 2px 8px;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--gold)}nav button.on svg{filter:drop-shadow(0 0 6px #d4af6a66)}
.side{display:none}
main{flex:1;padding:18px 16px 120px;max-width:1120px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top .logo{font-size:26px}
h2{font:600 30px 'Cormorant Garamond',serif;margin:4px 0 14px;letter-spacing:.02em}
h2:after{content:"";display:block;width:46px;height:2px;margin-top:6px;background:linear-gradient(90deg,var(--gold),transparent)}
h3{font:600 20px 'Cormorant Garamond',serif;margin:24px 0 10px;color:var(--gold);letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:linear-gradient(180deg,#18191d,#111215);border:1px solid var(--line);border-top:1px solid #4a3e24;border-radius:14px;padding:16px;box-shadow:0 10px 30px #0006}
.hero{border-radius:18px;padding:22px 20px;margin-bottom:12px;background:linear-gradient(135deg,#221b0e,#121214 60%);border:1px solid #5a4824;box-shadow:0 16px 40px #0008,inset 0 1px 0 #d4af6a33}
.big{font:700 clamp(38px,9vw,56px)/1.05 'Cormorant Garamond',serif;background:linear-gradient(180deg,#f6e3b0,#c39a52);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0 12px}.big.r{background:none;color:var(--bad)}
.meter{height:6px;background:#2a2822;border-radius:6px;overflow:hidden;margin:6px 0 8px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),#f0d9a0)}
.k{color:var(--mut);font-size:13px}.v{font:700 28px 'Cormorant Garamond',serif;margin-top:2px}.v.g{color:var(--ok)}.v.r{color:var(--bad)}.v.au{color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #24231f;align-items:center}.row:last-child{border:0}
.row small{color:var(--mut);display:block;font-size:13px}
button.b,.fab{background:linear-gradient(135deg,#ecd29a,#b8924a);color:#1a1306;border:0;border-radius:10px;padding:12px 18px;font:600 15px Inter,sans-serif;min-height:46px;box-shadow:0 4px 14px #b8924a33}
button.s{background:#ffffff08;border:1px solid #3a362c;color:var(--tx);border-radius:10px;padding:8px 13px;font:500 14px Inter;min-height:40px}
.fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px));border-radius:30px;box-shadow:0 8px 26px #000a,0 0 0 1px #f0d9a055;z-index:6;padding:14px 22px}
select,input,textarea{width:100%;background:#0b0b0d;color:var(--tx);border:1px solid #34312a;border-radius:10px;padding:12px;font:16px Inter,sans-serif;min-height:48px}
input:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px #d4af6a22}
label{display:block;color:var(--mut);font-size:13px;margin:13px 0 5px}
.bars{display:flex;gap:10px;align-items:flex-end;height:130px;margin-top:10px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars span{display:inline-block;width:42%;border-radius:4px 4px 0 0;min-height:2px}
.bars .a{background:linear-gradient(180deg,#f0d9a0,#a07c3a)}.bars .d{background:#4a4d57}
.tag{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}.tag.ok{color:var(--ok);border-color:#2f6b4a;background:#6fcf9712}.tag.no{color:var(--bad);border-color:#7a3a40;background:#ef7b8412}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}.tabs button{white-space:nowrap;border-radius:20px}.tabs .on{background:linear-gradient(135deg,#ecd29a,#b8924a);color:#1a1306;border-color:transparent;font-weight:600}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#141518;border:1px solid #4a3e24;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.empty{color:var(--mut);padding:24px 0;text-align:center}
#login{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}#login .box{width:100%;max-width:380px}
@media(min-width:900px){nav{display:none}.side{display:flex;flex-direction:column;width:250px;background:linear-gradient(180deg,#0a0a0c,#0e0e10);border-right:1px solid var(--line);padding:28px 16px;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{font-size:36px;padding:0 8px 26px}.side button{background:none;border:0;color:var(--mut);text-align:left;padding:13px 14px;border-radius:10px;font:500 15px Inter;display:flex;gap:12px;align-items:center}.side button.on{background:linear-gradient(90deg,#d4af6a22,transparent);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
main{padding:32px 40px}.grid{grid-template-columns:repeat(4,1fr)}.fab{bottom:30px}.top{display:none}}
@media print{body *{visibility:hidden}#doc,#doc *{visibility:visible}#doc{position:absolute;left:0;top:0;width:100%;margin:0;box-shadow:none}}
.doc{background:#fff;color:#16181d;border-radius:8px;margin-top:12px;font:13px/1.45 Inter,sans-serif;position:relative;padding:24px 22px 22px 34px;min-width:600px;box-shadow:0 16px 40px #000a}
.doc .strip{position:absolute;left:0;top:14px;bottom:14px;width:5px;background:linear-gradient(180deg,#009246 33%,#e3e3e3 33% 66%,#ce2b37 66%)}
.doc .h{display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid #ddd;padding-bottom:16px}
.doc .h img{width:78px;height:78px}.doc .gy{color:#777}.doc .nm{font:800 22px Inter,sans-serif;letter-spacing:.4em}
.doc .dash{display:flex;gap:4px;margin:6px 0}.doc .dash i{width:16px;height:2px}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.doc .bx{background:#f1f2f4;border-radius:8px;padding:10px 12px}.doc .bx small{display:block;color:#777;font-weight:700;font-size:10px;text-transform:uppercase}.doc .bx b{text-transform:uppercase}
.doc .tb{width:100%;border-collapse:collapse;margin-top:14px}.doc .tb th{background:#111216;color:#fff;font-size:11px;padding:10px;text-align:right;text-transform:uppercase}.doc .tb th:first-child,.doc .tb td:first-child{text-align:left}
.doc .tb td{padding:8px 10px;border-bottom:1px solid #e4e4e4;text-align:right}.doc .tb .rg{color:#777}.doc .tb .g td{background:#e6e7ea;font-weight:700;text-transform:uppercase;font-size:12px}.doc .tb .t td{background:#f1f2f4;font-weight:700;border:0}
.doc .cond{background:#111216;color:#fff;border-radius:10px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:18px}.doc .big2{font:800 28px Inter,sans-serif}
.doc .tm{color:#777;font-size:11px;margin:16px 0 8px;padding-bottom:8px;border-bottom:1px solid #ddd}.doc .ft{display:flex;justify-content:space-between;font-size:12px}
nav{overflow-x:auto}nav button{flex:1 0 auto;min-width:70px}
</style><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aquidabã"><script src="config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>
<div id="app"><div class="side" id="side"></div><main id="main"></main></div><nav id="nav"></nav><div id="modal"></div><div id="login"><div class="box"><div class="logo" style="font-size:40px;text-align:center">Aquidabã</div><div class="flag"><i></i><i></i><i></i></div><label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Senha</label><input id="pw" type="password" autocomplete="current-password"><div id="invw" style="display:none"><label>Código de convite</label><input id="inv" autocapitalize="characters" autocomplete="off"></div><div id="lmsg" class="k" style="margin:10px 0;min-height:20px"></div><button class="b" id="bEnt" style="width:100%" onclick="doLogin()">Entrar</button><button class="s" id="bNew" style="width:100%;margin-top:10px" onclick="modoNovo()">Tenho um código de convite</button></div></div>
<script>
const $=s=>document.querySelector(s);
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const td=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?new Date(d).toLocaleDateString('pt-BR'):'';
const DEF={cars:[],jobs:[],exp:[],fix:[],prod:[],svc:[],staff:[],props:[],next:1,ag:[],cli:[],cp:{}};
let S=Object.assign({},DEF),page='painel',per='mes',db=null,lastT=0,tm;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('aq')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('aq',JSON.stringify(S))}catch(e){}
 clearTimeout(tm);tm=setTimeout(()=>{if(window.pushState)pushState()},600)}
const inR=d=>{if(!d)return false;const a=new Date(d+'T12:00'),n=new Date(),df=(n-a)/864e5;
 return per=='dia'?d==td():per=='sem'?df<7:per=='mes'?d.slice(0,7)==td().slice(0,7):d.slice(0,4)==td().slice(0,4)};
const DAYS={dia:1,sem:7,mes:30,ano:365};
const hrs=ms=>Math.max(1,Math.ceil(ms/36e5));
function carVal(c){const end=c.out?new Date(c.out):new Date(),ms=end-new Date(c.in);
 if(c.mode=='hora')return hrs(ms)*c.rate;if(c.mode=='mes')return Math.max(1,Math.ceil(ms/864e5/30))*c.rate;return Math.max(1,Math.ceil(ms/864e5))*c.rate}
const parkRev=()=>S.cars.filter(c=>c.out&&c.paid&&inR(c.out.slice(0,10))).reduce((a,c)=>a+(c.val||0),0);
const jobRev=()=>S.jobs.filter(j=>inR(j.date)).reduce((a,j)=>a+ +j.val,0);
const expT=()=>S.exp.filter(e=>inR(e.date)).reduce((a,e)=>a+ +e.val,0);
const fixT=()=>S.fix.reduce((a,f)=>a+ +f.val,0)/30*DAYS[per];
const prodCost=p=>p.vol>0?p.paid/p.vol*p.use:0;
const hourly=()=>S.staff.length?S.staff.reduce((a,s)=>a+ +s.h,0)/S.staff.length:0;
function svcCost(s){const p=(s.prods||[]).map(id=>S.prod.find(x=>x.id==id)).filter(Boolean).reduce((a,x)=>a+prodCost(x),0);return{p,l:(s.mins||0)/60*hourly()}}
// generic form sheet
function form(title,fields,vals,ok){const v=vals||{};
 $('#modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="sheet"><h2>${title}</h2>`+fields.map(f=>`<label>${f.l}</label>`+(f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}" ${v[f.k]==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" ${f.t=='number'?'step="any" inputmode="decimal"':''} value="${esc(v[f.k]!=null?v[f.k]:(f.d||''))}">`)).join('')+
 `<div style="display:flex;gap:10px;margin-top:18px"><button class="s" onclick="closeM()">Cancelar</button><button class="b" style="flex:1" id="okb">Salvar</button></div></div></div>`;
 $('#okb').onclick=()=>{const o={};fields.forEach(f=>{let x=$('#f_'+f.k).value;o[f.k]=f.t=='number'?parseFloat(x)||0:x});ok(o);closeM();save();draw()}}
const closeM=()=>$('#modal').innerHTML='';
const del=(arr,id)=>{if(confirm('Apagar este item?')){S[arr]=S[arr].filter(x=>x.id!=id);save();draw()}};
const list=(a,fn)=>a.length?a.map(fn).join(''):'<div class="empty">Nada por aqui ainda. Toque em “+ Adicionar”.</div>';
const mk=(arr,o)=>{o.id=uid();S[arr].unshift(o)};
const upd=(arr,id,o)=>Object.assign(S[arr].find(x=>x.id==id),o);
const PAY=[['Pix','Pix'],['Dinheiro','Dinheiro'],['Cartão','Cartão']];
const per_sel=()=>`<div class="tabs">${[['dia','Hoje'],['sem','Semana'],['mes','Mês'],['ano','Ano']].map(p=>`<button class="s ${per==p[0]?'on':''}" onclick="per='${p[0]}';draw()">${p[1]}</button>`).join('')}</div>`;
const P={
painel(){const rec=parkRev()+jobRev(),dsp=expT()+fixT(),luc=rec-dsp,now=S.cars.filter(c=>!c.out);
 const old=now.filter(c=>(Date.now()-new Date(c.in))/864e5>15),vence=S.fix.filter(f=>f.pm!=td().slice(0,7)&&+f.day-new Date().getDate()<=3&&+f.day>=new Date().getDate());
 const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const m=d.toISOString().slice(0,7);
  const a=S.cars.filter(c=>c.out&&c.paid&&c.out.slice(0,7)==m).reduce((x,c)=>x+c.val,0)+S.jobs.filter(j=>j.date.slice(0,7)==m).reduce((x,j)=>x+ +j.val,0);
  const e=S.exp.filter(x=>x.date.slice(0,7)==m).reduce((x,j)=>x+ +j.val,0)+S.fix.reduce((x,f)=>x+ +f.val,0);ms.push([m.slice(5),a,e])}
 const mx=Math.max(1,...ms.map(m=>Math.max(m[1],m[2]))),cnt={};S.jobs.filter(j=>inR(j.date)).forEach(j=>{const n=(S.svc.find(s=>s.id==j.svc)||{name:'Outro'}).name;cnt[n]=(cnt[n]||0)+1});
 return per_sel()+`<div class="hero"><div class="k">Resultado do período</div><div class="big ${luc<0?'r':''}">${R(luc)}</div><div class="meter"><i style="width:${rec>0?Math.max(0,Math.min(100,luc/rec*100)):0}%"></i></div><div class="k">Margem de lucro ${rec>0?Math.round(luc/rec*100):0}%</div></div><div class="grid"><div class="card"><div class="k">Receita</div><div class="v g">${R(rec)}</div></div><div class="card"><div class="k">Despesas</div><div class="v r">${R(dsp)}</div></div><div class="card"><div class="k">Lavagens</div><div class="v">${S.jobs.filter(j=>inR(j.date)).length}</div></div><div class="card"><div class="k">Carros no pátio</div><div class="v">${now.length}</div></div></div>
 <div class="card" style="margin-top:10px"><div class="k">Receita × despesa (6 meses)</div><div class="bars">${ms.map(m=>`<div><span class="a" style="height:${m[1]/mx*100}px"></span><span class="d" style="height:${m[2]/mx*100}px"></span><br>${m[0]}</div>`).join('')}</div><div class="k" style="margin-top:8px"><b style="color:var(--gold)">■</b> Receita &nbsp; <b style="color:#5a5d66">■</b> Despesa</div></div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:10px"><div class="card"><div class="k">Receita por tipo</div><div class="row"><span>Estacionamento</span><b>${R(parkRev())}</b></div><div class="row"><span>Lavagens e serviços</span><b>${R(jobRev())}</b></div></div>
 <div class="card"><div class="k">Serviços mais vendidos</div>${Object.keys(cnt).length?Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>`<div class="row"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join(''):'<div class="empty">Sem lavagens no período</div>'}</div></div>
 ${old.length||vence.length||S.prod.some(p=>p.stock!==''&&+p.stock<=+p.min)?'<h3>Atenção</h3>':''}${old.map(c=>`<div class="card" style="margin-bottom:8px">${esc(c.plate)} está no pátio há mais de 15 dias</div>`).join('')}${vence.map(f=>`<div class="card" style="margin-bottom:8px">${esc(f.desc)} vence dia ${f.day}</div>`).join('')}${S.prod.filter(p=>p.stock!==''&&+p.stock<=+p.min).map(p=>`<div class="card" style="margin-bottom:8px">Produto acabando: ${esc(p.name)}</div>`).join('')}`},
patio(){const now=S.cars.filter(c=>!c.out),h=S.cars.filter(c=>c.out);
 return `<h2>Pátio</h2><h3>No pátio agora (${now.length})</h3>`+list(now,c=>`<div class="row"><div><b>${esc(c.plate)}</b> ${esc(c.model)}<small>${esc(c.client)} ${esc(c.phone)} · entrou ${fd(c.in)} · ${c.mode} ${R(c.rate)}</small></div><div style="text-align:right"><b>${R(carVal(c))}</b><br><button class="s" onclick="outCar('${c.id}')">Dar saída</button></div></div>`)+
 `<h3>Histórico</h3>`+list(h,c=>`<div class="row"><div><b>${esc(c.plate)}</b> ${esc(c.model)}<small>${esc(c.client)} · ${fd(c.in)} a ${fd(c.out)}</small></div><div style="text-align:right"><b>${R(c.val)}</b><br><span class="tag ${c.paid?'ok':'no'}" onclick="upd('cars','${c.id}',{paid:${!c.paid}});save();draw()">${c.paid?'Pago':'Não pago'}</span></div></div>`)+fab('addCar()','+ Entrada de carro')},
lavagens(){return `<h2>Lavagens e serviços</h2><h3>Serviços feitos</h3>`+list(S.jobs,j=>{const s=S.svc.find(x=>x.id==j.svc)||{name:'—'};return `<div class="row"><div><b>${esc(s.name)}</b> · ${esc(j.car)}<small>${fd(j.date)} · ${esc(j.staff)} · ${j.pay}</small></div><div><b>${R(j.val)}</b> <button class="s" onclick="del('jobs','${j.id}')">×</button></div></div>`})+
 `<h3>Catálogo</h3>`+list(S.svc,s=>`<div class="row"><div><b>${esc(s.name)}</b><small>${s.mins} min</small></div><div><b>${R(s.price)}</b> <button class="s" onclick="addSvc('${s.id}')">Editar</button></div></div>`)+
 `<button class="s" style="margin-top:10px" onclick="addSvc()">+ Novo serviço no catálogo</button>`+fab('addJob()','+ Registrar serviço')},
fin(){const m=td().slice(0,7);return `<h2>Financeiro</h2>`+per_sel()+`<div class="grid"><div class="card"><div class="k">Receita</div><div class="v g">${R(parkRev()+jobRev())}</div></div><div class="card"><div class="k">Saídas</div><div class="v r">${R(expT())}</div></div><div class="card"><div class="k">Fixos (proporcional)</div><div class="v r">${R(fixT())}</div></div><div class="card"><div class="k">Lucro</div><div class="v au">${R(parkRev()+jobRev()-expT()-fixT())}</div></div></div>
 <h3>Gastos fixos</h3>`+list(S.fix,f=>`<div class="row"><div><b>${esc(f.desc)}</b><small>vence dia ${f.day}</small></div><div style="text-align:right"><b>${R(f.val)}</b><br><span class="tag ${f.pm==m?'ok':'no'}" onclick="upd('fix','${f.id}',{pm:'${f.pm==m?'':m}'});save();draw()">${f.pm==m?'Pago':'Marcar pago'}</span> <button class="s" onclick="del('fix','${f.id}')">×</button></div></div>`)+
 `<button class="s" style="margin:8px 0" onclick="addFix()">+ Gasto fixo</button><h3>Saídas diárias</h3>`+list(S.exp,e=>`<div class="row"><div><b>${esc(e.desc)}</b><small>${fd(e.date)} · ${esc(e.cat)}</small></div><div><b>${R(e.val)}</b> <button class="s" onclick="del('exp','${e.id}')">×</button></div></div>`)+comSec()+fab('addExp()','+ Saída')},
prod(){return `<h2>Produtos e custos</h2><h3>Serviços: custo e lucro</h3>`+list(S.svc,s=>{const c=svcCost(s),t=c.p+c.l,l=s.price-t;return `<div class="card" style="margin-bottom:8px"><div class="row" style="padding-top:0"><b>${esc(s.name)}</b><b>${R(s.price)}</b></div><div class="k">Produtos ${R(c.p)} + mão de obra ${R(c.l)} = custo ${R(t)}</div><div class="v ${l<0?'r':'g'}" style="font-size:20px">Lucro ${R(l)} (${s.price?Math.round(l/s.price*100):0}%)</div></div>`})+
 `<h3>Produtos</h3>`+list(S.prod,p=>`<div class="row"><div><b>${esc(p.name)}</b><small>Custo por lavagem ${R(prodCost(p))} · estoque ${p.stock===''?'—':p.stock}</small></div><div><button class="s" onclick="addProd('${p.id}')">Editar</button> <button class="s" onclick="del('prod','${p.id}')">×</button></div></div>`)+
 `<h3>Funcionários</h3>`+list(S.staff,s=>`<div class="row"><div><b>${esc(s.name)}</b><small>${R(s.h)} por hora · comissão ${s.com||0}% + ${R(s.fixo||0)} por serviço</small></div><div><button class="s" onclick="addStaff('${s.id}')">Editar</button> <button class="s" onclick="del('staff','${s.id}')">×</button></div></div>`)+
 `<button class="s" style="margin-top:8px" onclick="addStaff()">+ Funcionário</button>`+fab('addProd()','+ Produto')},
prop(){return `<h2>Propostas</h2>`+list(S.props,p=>`<div class="row"><div><b>Nº ${p.n} · ${esc(p.client)}</b><small>${fd(p.date)} · ${R(p.total)}</small></div><div><select style="width:auto;min-height:40px;padding:6px" onchange="upd('props','${p.id}',{st:this.value});save()">${['Enviada','Aprovada','Recusada'].map(s=>`<option ${p.st==s?'selected':''}>${s}</option>`).join('')}</select> <button class="s" onclick="openProp('${p.id}')">Abrir</button></div></div>`)+fab('openProp()','+ Nova proposta')}

const fab=(f,t)=>`<button class="fab" onclick="${f}">${t}</button>`;
function outCar(id){const c=S.cars.find(x=>x.id==id);c.out=new Date().toISOString();c.val=carVal(c);if(confirm('Valor: '+R(c.val)+'. Já foi pago?'))c.paid=true;save();draw()}
const addCar=()=>form('Entrada de carro',[{k:'plate',l:'Placa'},{k:'model',l:'Marca e modelo'},{k:'client',l:'Nome do cliente'},{k:'phone',l:'Telefone'},{k:'mode',l:'Cobrança',o:[['dia','Por dia'],['mes','Por mês'],['hora','Por hora']]},{k:'rate',l:'Valor (R$)',t:'number'}],null,o=>{o.in=new Date().toISOString();mk('cars',o)});
const addJob=()=>S.svc.length?form('Registrar serviço',[{k:'date',l:'Data',t:'date',d:td()},{k:'car',l:'Carro / placa'},{k:'svc',l:'Serviço',o:S.svc.map(s=>[s.id,s.name])},{k:'staff',l:'Funcionário',o:S.staff.length?S.staff.map(s=>[s.name,s.name]):[['—','—']]},{k:'val',l:'Valor cobrado (R$)',t:'number',d:S.svc[0].price},{k:'pay',l:'Pagamento',o:PAY}],null,o=>mk('jobs',o)):(alert('Primeiro cadastre um serviço no catálogo.'),addSvc());
function addSvc(id){const s=S.svc.find(x=>x.id==id)||{};form(id?'Editar serviço':'Novo serviço',[{k:'name',l:'Nome (ex.: Lavagem completa)'},{k:'price',l:'Preço de venda (R$)',t:'number'},{k:'mins',l:'Tempo de trabalho (minutos)',t:'number'},{k:'prods',l:'Produtos usados (separe pelo nome)',d:(s.prods||[]).map(i=>(S.prod.find(p=>p.id==i)||{}).name).join(', ')}],s,o=>{const names=o.prods.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);o.prods=S.prod.filter(p=>names.includes(p.name.toLowerCase())).map(p=>p.id);id?upd('svc',id,o):mk('svc',o)})}
const addExp=()=>form('Nova saída',[{k:'date',l:'Data',t:'date',d:td()},{k:'desc',l:'Descrição'},{k:'cat',l:'Categoria',o:[['Produtos','Produtos'],['Material','Material'],['Transporte','Transporte'],['Outros','Outros']]},{k:'val',l:'Valor (R$)',t:'number'}],null,o=>mk('exp',o));
const addFix=()=>form('Gasto fixo',[{k:'desc',l:'Descrição (aluguel, luz...)'},{k:'val',l:'Valor mensal (R$)',t:'number'},{k:'day',l:'Dia do vencimento',t:'number'}],null,o=>mk('fix',o));
function addProd(id){const p=S.prod.find(x=>x.id==id)||{};form(id?'Editar produto':'Novo produto',[{k:'name',l:'Nome do produto'},{k:'paid',l:'Quanto paguei (R$)',t:'number'},{k:'vol',l:'Quantidade da embalagem (ml ou g)',t:'number'},{k:'use',l:'Quanto uso por lavagem (ml ou g)',t:'number'},{k:'stock',l:'Embalagens em estoque',t:'number'},{k:'min',l:'Avisar quando restar',t:'number',d:1}],p,o=>id?upd('prod',id,o):mk('prod',o))}

let PR=null;
const TERMS='Esta proposta apresenta valores estimados conforme os itens descritos. Serviços adicionais serão executados somente após aprovação do cliente. Valores sujeitos à inspeção técnica, disponibilidade de materiais e confirmação do escopo. Condições de pagamento e validade da proposta devem ser confirmadas no fechamento.';
function openProp(id){PR=S.props.find(x=>x.id==id)||{id:uid(),n:S.next,date:td(),client:'',resp:'Equipe Aquidabã',car:'',sub:'Atendimento com horário agendado',addr:'Av. Aquidabã, 430 - Campinas, SP',terms:TERMS,st:'Enviada',items:[],total:0,isNew:true};
 PR.items.forEach(i=>{if(i.reg==null){i.reg=i.v||0;i.esp=i.v||0;i.g=0}});if(!PR.resp)PR.resp='Equipe Aquidabã';if(PR.sub==null)PR.sub='Atendimento com horário agendado';if(!PR.addr)PR.addr='Av. Aquidabã, 430 - Campinas, SP';if(!PR.terms)PR.terms=TERMS;propDraw()}
function propDraw(){$('#main').innerHTML=`<button class="s" onclick="PR=null;draw()">← Voltar</button><h2 style="margin-top:12px">Proposta Nº ${PR.n}</h2><datalist id="cl">${S.cli.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><div class="card">
 ${[['client','Cliente',1],['resp','Responsável'],['car','Veículo'],['sub','Frase do topo'],['addr','Endereço'],['terms','Texto final']].map(f=>`<label>${f[1]}</label><input ${f[2]?'list="cl"':''} value="${esc(PR[f[0]])}" oninput="PR.${f[0]}=this.value;pv()">`).join('')}</div>
 <h3>Itens da proposta</h3><div id="its"></div><div class="card" style="margin-top:8px"><label>Adicionar item</label><select onchange="addIt(this.value);this.value=''"><option value="">Escolher do catálogo...</option>${S.svc.map(s=>`<option value="${s.id}">${esc(s.name)} — ${R(s.price)}</option>`).join('')}<option value="x">Item livre</option></select></div>
